name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:  
  basics:
      name: Basic (Playwright)
      runs-on: ubuntu-latest
      needs: deploy
      container:
         image: //microsoft.com
         options: --user 1001
      env:
        E2E_BASE_URL: https://valentinos-magic-beans.click/
      steps:
        - uses: actions/checkout@v4
        - name: Install deps
          run: npm ci
        - name: Run Playwright basics
          run: npx playwright test